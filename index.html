tr.grp td { font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); padding-top: 18px; border-bottom: 2px solid var(--rule); }

.star { border: 0; background: none; cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted); padding: 2px 6px; border-radius: 4px; }
.star.on { color: #E5AC00; }
td .add { margin-left: 8px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 2px; white-space: nowrap; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.wait { background: var(--sunk); color: var(--muted); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filter input { max-width: 260px; }

/* Liste à cocher (onglet Courses) */
.shop-head { display: flex; flex-direction: column; gap: 12px; }
.shop-head h2 { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; }
.progress { height: 10px; background: var(--sunk); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.shop-aisle { min-width: 0; }
.shop-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 2px; cursor: pointer; border-bottom: 1px solid var(--line); min-height: 52px; }
.shop-item input { width: 24px; height: 24px; margin: 0; accent-color: var(--accent); }
.shop-item .nm { overflow-wrap: anywhere; font-size: 16px; }
.shop-item .qty { font-weight: 700; color: var(--accent); white-space: nowrap; }
.shop-item.done .nm { text-decoration: line-through; color: var(--muted); }
.shop-item.done .qty { color: var(--muted); }


/* Éditeur de recettes */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink); display: inline-flex; gap: 8px; align-items: baseline; }
.chip small { font-size: 12px; color: var(--muted); font-weight: 700; }
.chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.chip[aria-pressed="true"] small, .chip[aria-selected="true"] small { color: inherit; opacity: .75; }
.chips.petits .chip { padding: 4px 11px; font-size: 13px; border-style: dashed; }
/* Glisser pour supprimer */
.sw { position: relative; overflow: hidden; }
.sw-fond { position: absolute; top: 0; right: 0; bottom: 0; width: 84px; border: 0; background: #D32F2F; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; }
.sw-fond svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sw-piste { position: relative; background: var(--bg); display: flex; align-items: stretch; transition: transform .22s ease; touch-action: pan-y; }
.sw-piste.glisse { transition: none; }
.sw-piste > :first-child { flex: 1; min-width: 0; }
.sw-pc { display: none; align-self: center; flex: none; color: var(--muted); }
.sw-pc svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sw-pc:hover { color: var(--danger); border-color: var(--danger); }
@media (hover: hover) and (pointer: fine) {
  .sw-pc { display: inline-grid; place-items: center; margin-left: 6px; }
  .sw-fond { display: none; }
  .astuce-sw { display: none; }
}
.astuce-sw { font-size: 12.5px; }
.art-liste { border-top: 3px solid var(--rule); }
.art-grp { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 14px 4px 6px; border-bottom: 1px solid var(--line); }
.art-ligne { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.art-nom { overflow-wrap: anywhere; }
.art-q { color: var(--muted); font-size: 14px; }
.effacees { margin-top: 18px; }
.effacees .bar { justify-content: space-between; border-bottom: 1px solid var(--line); padding: 6px 0; }
.sw .rec-row, .sw .art-ligne { border-bottom: 0; }
.rec-list .sw, .art-liste .sw { border-bottom: 1px solid var(--line); }
/* Retour aux recettes, toujours visible */
.fiche-nav { position: sticky; top: 0; z-index: 6; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--bg); padding: 10px 0; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
.retour-rec { display: inline-flex; align-items: center; gap: 10px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 700; padding: 10px 16px 10px 12px; min-height: 46px; }
.retour-rec .fl { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 16px; }
.retour-rec.danger { border-color: var(--danger); color: var(--danger); }
.retour-rec.danger .fl { background: var(--danger); }
.rec-list { display: flex; flex-direction: column; border-top: 3px solid var(--rule); }
.rec-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 4px; cursor: pointer; color: var(--ink); }
.rec-nom { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: baseline; min-width: 0; }
.rec-nom b { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.rec-meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.rec-row.off b { color: var(--muted); text-decoration: line-through; }
.fiche-tete { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.fiche-tete h2 { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper .icon { border-color: var(--rule); border-width: 2px; color: var(--ink); font-size: 20px; width: 40px; height: 40px; }
.delai-val { font-size: 32px; font-weight: 800; min-width: 2ch; text-align: center; color: var(--accent); }
.grille-reg { display: grid; grid-template-columns: minmax(6rem, max-content) 4rem 4rem; gap: 2px 0; align-items: center; }
.grille-reg .lbl { text-align: center; font-size: 11px; }
.gj { font-weight: 600; font-size: 14px; padding: 4px 0; }
.gc { display: flex; justify-content: center; padding: 4px 0; cursor: pointer; }
.gc input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
.ing-rows { display: flex; flex-direction: column; gap: 10px; }
.sans-ingr { display: flex; gap: 10px; align-items: flex-start; margin: 6px 0 10px; cursor: pointer; }
.sans-ingr input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
.sans-ingr span { display: flex; flex-direction: column; gap: 2px; }
.sans-ingr small { color: var(--muted); }
.ing-row { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, .8fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px; align-items: center; }
.ing-head span { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ing-etat { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: -2px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ing-etat.ok { color: var(--ok); }
.ing-etat.ok .ico svg { width: 16px; height: 16px; display: block; }
.ing-etat.ok b { color: var(--ink); }
.ing-etat.sugg { background: var(--todo-soft); border-left: 4px solid var(--todo-line); padding: 8px 10px; color: var(--ink); }
.sugg-t { font-weight: 700; flex-basis: 100%; }
.sugg-b { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 5px 10px; cursor: pointer; text-align: left; }
.sugg-b b { font-size: 14px; }
.sugg-b small { font-size: 11px; color: var(--muted); }
.sugg-n { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.ing-etat:empty { display: none; }
.fiche-apercu { background: var(--sunk); border-top-color: var(--accent); padding: 16px; }
.notes .err { color: var(--danger); font-weight: 600; }
.apercu-liste { list-style: none; margin: 0; padding: 0; }
.apercu-liste li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.apercu-liste small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.apercu-liste .qty { font-weight: 700; color: var(--accent); }
.fiche-actions { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; border-top: 3px solid var(--rule); z-index: 5; }
body.vue-mobile .fiche-actions { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); }
body.vue-mobile .fiche-actions .btn.primary { flex: 1; padding-block: 14px; }
body.vue-mobile .ing-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
body.vue-mobile .ing-row > input.ing-produit { grid-column: 1 / 3; }
body.vue-mobile .ing-row > .icon { grid-column: 3; grid-row: 1; }
body.vue-mobile .ing-row > select { grid-column: 1 / -1; }
body.vue-mobile .ing-head { display: none; }
body.vue-mobile .fiche-tete h2 { font-size: 1.6rem; }

.retour { margin-bottom: -8px; }
.retour .btn { padding-left: 0; }
.fiche-lecture { gap: 10px; }
.fl-ligne { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 12px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.fl-ligne > span:last-child { font-weight: 600; }
.fl-ings { list-style: none; margin: 0; padding: 0; }
.fl-ings li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.fl-ings small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.fl-ings .qty { font-weight: 700; color: var(--accent); }
.ok-msg { color: var(--ok); font-weight: 600; }
.fiche-actions .status.warn { font-weight: 600; }
body.vue-mobile .fl-ligne { grid-template-columns: 1fr; gap: 2px; }

.cotillons { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; }
.ing-etat .btn.mini { padding: 0 4px; font-size: 12px; }

/* Étapes (smartphone) */
.etapes-tete { display: flex; flex-direction: column; gap: 8px; }
.etapes-barre { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.etapes-barre i { height: 6px; border-radius: 3px; background: var(--line); display: block; }
.etapes-barre i.fait { background: var(--ok); }
.etapes-barre i.encours { background: var(--accent); }
.etape-faite { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; color: var(--ink); }
.etape-faite .etape-ok { color: var(--ok); display: flex; }
.etape-faite .etape-ok svg { width: 22px; height: 22px; }
.etape-txt { display: flex; flex-direction: column; min-width: 0; }
.etape-txt b { font-size: 15px; }
.etape-txt small { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.etape-mod { font-size: 13px; font-weight: 700; color: var(--accent); }
.etape-avenir { display: flex; gap: 12px; align-items: baseline; padding: 10px 14px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--muted); }
.etape-avenir b { color: var(--line); font-size: 18px; }
body.vue-mobile form > .etapes-nav { flex-direction: row; flex-wrap: nowrap; }
body.vue-mobile form > .etapes-nav .btn:not(.primary) { flex: none; width: 56px; padding-inline: 0; font-size: 18px; }
body.vue-mobile form > .etapes-nav .btn.primary { flex: 1; width: auto; }


/* ===== Parcours en pages (tunnel) ===== */
body.tunnel .top, body.tunnel .navrow, body.tunnel #storestatus, body.tunnel .bottombar, body.tunnel .retour { display: none !important; }
body.tunnel { padding-bottom: 24px; }
body.tunnel .app { max-width: 720px; }
.tn-page { display: flex; flex-direction: column; gap: 16px; min-height: calc(100vh - 60px); animation: tn-d .28s ease-out; }
.tn-page.depuis-g { animation-name: tn-g; }
@keyframes tn-d { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes tn-g { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .tn-page { animation: none; } }
.tn-haut { display: flex; flex-direction: column; gap: 10px; }
.tn-nav { display: flex; align-items: center; gap: 10px; }
.tn-x { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 16px; cursor: pointer; flex: none; }
.tn-sem { flex: 1; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.tn-num { width: 40px; text-align: right; font-weight: 800; font-size: 14px; color: var(--muted); }
.tn-barre { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.tn-barre i { height: 6px; border-radius: 3px; background: var(--line); display: block; }
.tn-barre i.fait { background: var(--ok); }
.tn-barre i.encours { background: var(--accent); }
.tn-titre { font-size: clamp(2rem, 7vw, 2.6rem); font-weight: 800; letter-spacing: -.035em; line-height: 1.02; margin-top: 6px; }
.tn-sous { color: var(--muted); font-size: 15px; }
.tn-bas { position: sticky; bottom: 0; margin-top: auto; background: var(--bg); border-top: 3px solid var(--rule); padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; z-index: 5; }
.tn-bas-l { display: flex; gap: 10px; }
.tn-bas-l .btn.primary { flex: 1; padding-block: 15px; font-size: 16px; }
.tn-retour { width: 56px; flex: none; font-size: 18px; }
.tn-question { font-weight: 700; font-size: 15px; }
/* Entrée */
.tn-entree { display: flex; flex-direction: column; gap: 14px; border: 2px solid var(--rule); border-radius: 16px; padding: 20px; background: var(--surface); }
.tn-entree h2 { font-size: 1.9rem; letter-spacing: -.03em; line-height: 1.05; }
.tn-plan { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; position: relative; }
.tn-plan::before { content: ""; position: absolute; left: 10%; right: 10%; top: 13px; height: 2px; background: var(--line); }
.tn-plan li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.2; color: var(--muted); }
.tn-plan b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); background: var(--surface); font-size: 12px; }
.tn-plan li.fait { color: var(--ink); } .tn-plan li.fait b { background: var(--ok); border-color: var(--ok); color: #fff; }
.tn-plan li.encours { color: var(--ink); } .tn-plan li.encours b { border-color: var(--accent); color: var(--accent); }
body.vue-mobile .tn-entree { padding: 16px; gap: 12px; }
body.vue-mobile .tn-entree h2 { font-size: 1.6rem; }
.tn-go { padding-block: 15px; font-size: 16px; }
/* La semaine en pastilles */
.tj-liste { display: flex; flex-direction: column; gap: 8px; }
.tj { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: start; }
.tj.auj .tj-date .dname { color: var(--accent); }
.tj-date { display: flex; flex-direction: column; padding-top: 4px; }
.tj-date .dnum { font-size: 32px; }
.tj-date .dname { font-size: 10px; }
.tj-cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tj-slot { display: flex; flex-direction: column; align-items: flex-start; gap: 0; width: 100%; min-height: 54px; padding: 7px 12px; border-radius: 12px; border: 2px solid var(--st-prevu-line); background: var(--st-prevu); color: var(--ink); cursor: pointer; text-align: left; transition: transform .1s; }
.tj-slot:active { transform: scale(.97); }
.tj-slot small { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tj-slot b { font-size: 15px; }
.tj-slot[data-etat="exclu"] { background: var(--st-exclu); border-color: var(--st-exclu-line); }
.tj-slot[data-etat="exclu"] b { color: var(--muted); font-weight: 600; }
.tj-slot[data-etat="invitation"] { background: var(--st-invit); border-color: var(--st-invit-line); }
.tj-slot[data-etat="resto"] { background: var(--st-resto); border-color: var(--st-resto-line); }
.tj-txt { font-size: 14px !important; padding: 6px 10px !important; }
.tj-passe { padding: 8px 12px; }
/* Préparation */
.tn-prepa { justify-content: flex-start; }
.prepa { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 40px 0; }
.prepa-cocotte { width: 190px; height: auto; }
.prepa-cocotte .corps { fill: var(--accent); }
.prepa-cocotte rect { fill: var(--ink); }
.prepa-cocotte .couvercle { animation: couv .5s ease-in-out infinite alternate; transform-origin: 100px 80px; }
.prepa-cocotte .vap { fill: none; stroke: var(--muted); stroke-width: 5; stroke-linecap: round; animation: vap 1.4s ease-in-out infinite; opacity: 0; }
.prepa-cocotte .v2 { animation-delay: .45s; } .prepa-cocotte .v3 { animation-delay: .9s; }
@keyframes couv { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-6px) rotate(2deg); } }
@keyframes vap { 0% { opacity: 0; transform: translateY(10px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
.prepa-txt { color: var(--muted); min-height: 2.6em; max-width: 30ch; }
.prepa-barre { width: min(260px, 70%); height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.prepa-barre i { display: block; height: 100%; background: var(--accent); animation: charge 2.2s ease-in-out forwards; width: 0; }
@keyframes charge { to { width: 100%; } }
@media (prefers-reduced-motion: reduce) { .prepa-cocotte .couvercle, .prepa-cocotte .vap { animation: none; opacity: 1; } }
/* Fin */
.tn-fin { align-items: center; justify-content: flex-start; padding-top: 14vh; text-align: center; min-height: 80vh; cursor: pointer; }
.fin-coche { color: var(--ok); animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
.fin-coche svg { width: 120px; height: 120px; display: block; }
.fin-titre { color: var(--ok); animation: monte .5s .15s ease-out both; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes monte { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Statut de la semaine : validé (vert), à faire / à valider (ambre), sans menu (gris) */
.statut { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; font-size: 1.5rem; line-height: 1.15; }
.statut svg { width: 1.15em; height: 1.15em; flex: none; }
.statut.ok { color: var(--ok); }
.statut.todo { color: var(--todo); }
.statut.sans { color: var(--muted); }
.statut-bloc { display: flex; flex-direction: column; gap: 4px; }
.statut-bloc.todo { border-left: 6px solid var(--todo-line); background: var(--todo-soft); padding: 12px 16px; }
.statut-bloc.todo p { color: var(--ink); }
.wk-etat { display: inline-flex; vertical-align: -2px; margin-left: 8px; }
.wk-etat svg { width: 16px; height: 16px; }
.wk-etat.ok { color: var(--ok); } .wk-etat.todo { color: var(--todo); } .wk-etat.sans { color: var(--muted); }
.sans-menu { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 999px; padding: 3px 10px 3px 8px; white-space: nowrap; }
.sans-menu svg { width: 14px; height: 14px; }
.mname.sans { display: block; }
.slotrow.jour-vide { display: flex; padding: 6px 0; }
.daybox.passe:has(.jour-vide) { opacity: .75; }
/* Complément après modification d'un menu validé */
.complement { border-top: 6px solid var(--rule); border-left: 6px solid var(--accent); background: var(--accent-soft); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.cp-tete { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.cp-tete h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; }
.cp-tete small { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.complement .shop-item { border-bottom-color: color-mix(in srgb, var(--accent) 22%, transparent); }
.complement .nm { display: flex; flex-direction: column; gap: 2px; }

    ["saucisse", /saucisse/],

            h("button", { type: "button", class: "star" + (fav ? " on" : ""), "aria-pressed": String(fav), "aria-label": (fav ? "Retirer des favoris : " : "Mettre en favori : ") + a.produit, text: fav ? "★" : "☆", onclick: function () { Store.toggleFavori(a.cle, a.produit); } }),
            h("span", { class: "art-nom" }, a.produit, a.perso ? h("span", { class: "add", text: "mes articles" }) : null),
            h("span", { class: "num art-q", text: a.quantite || "" }));
          tb.append(glisserPourSupprimer(ligne, "Supprimer " + a.produit, function () { supprimerArticle(a); }));
        });
      });
      if (!tb.childNodes.length) tb.append(h("p", { class: "empty", text: "Aucun article." }));
    }
    fi.addEventListener("input", function () { filtreArt = fi.value; lignes(); });
    lignes();
    list.append(fi, h("p", { class: "status astuce-sw", text: "Astuce : faites glisser un article vers la gauche pour le supprimer (code demandé)." }), tb);
    panelArt.append(card, list);
    if (focusFiltre) { var nf = document.getElementById("art-filtre"); if (nf) { nf.focus(); nf.setSelectionRange(nf.value.length, nf.value.length); } }
  }

  /* ---------- Onglet Courses : liste à cocher en magasin ---------- */
  var panelCourses = document.getElementById("panel-courses");
  var masquerCoches = false;
  try { masquerCoches = localStorage.getItem("menus-masquer-coches") === "1"; } catch (e) {}
  var coches = {}, cochesSemaine = null, fileEcriture = Promise.resolve();

  /* Clés stables par produit (rayon + nom) : les coches survivent à une nouvelle validation. */
  function indexerLignes(lignes) {
    var m = {}, ordre = [];
    (lignes || []).forEach(function (l) {
      var k0 = cleArticle(l.categorie + " " + l.produit), k = k0, n = 2;
      while (m[k]) k = k0 + "-" + (n++);
      m[k] = l; ordre.push(k);

    return { m: m, ordre: ordre };
  }
  /* Coches d'un menu, en clés produit (convertit les anciennes clés « l0, l1… »). */
  function cochesParProduit(doc) {
    var src = doc.coches || {}, ordre = indexerLignes(doc.courses).ordre, out = {};

  /* « 6 », « 500 g », « 6 à 8 pièce » → {a, b, u} ; null si la quantité n'est pas simple. */
  function lireQte(q) {

    var a = parseFloat(mt[1].replace(",", ".")), b = mt[2] ? parseFloat(mt[2].replace(",", ".")) : a;
    return { a: a, b: b, u: (mt[3] || "").trim() };

  function fmtN(n) { return String(Math.round(n * 1000) / 1000).replace(".", ","); }
  function fmtQ(a, b, u) { return (Math.abs(a - b) < 1e-9 ? fmtN(a) : fmtN(a) + " à " + fmtN(b)) + (u ? " " + u : ""); }
  /* Différence entre la liste déjà achetée (référence) et la nouvelle :

  function calculerComplement(ref, lignes) {

    b.ordre.forEach(function (k) {
      var nl = b.m[k], ol = a.m[k];
      if (!ol) { plus.push(L(k, nl, nl.quantite || "", { etat: "nouveau" })); return; }
      if ((ol.quantite || "") === (nl.quantite || "")) return;
      var o = lireQte(ol.quantite), n = lireQte(nl.quantite);
      if (o && n && o.u === n.u) {
        var da = n.a - o.a, db = n.b - o.b;
        if (da >= 0 && db >= 0 && (da > 0 || db > 0)) { plus.push(L(k, nl, "+ " + fmtQ(Math.min(da, db), Math.max(da, db), n.u), { etat: "hausse", avant: ol.quantite })); return; }

  function complementDe(doc) {

  }

  function renderCoursesOnglet() {

        h("div", { class: "bar" }, h("button", { type: "button", class: "btn primary", text: "Préparer la semaine", onclick: function () { choisirOnglet("prep"); } }))));

    }
    var docC = cochesParProduit(doc), version = id + "|" + (doc.valideLe || "");
    if (cochesSemaine !== version) { coches = docC; cochesSemaine = version; }
    else Object.keys(docC).forEach(function (k) { coches[k] = docC[k]; });
    var idx = indexerLignes(doc.courses);
    var lignes = idx.ordre.map(function (k) { var l = idx.m[k]; return { k: k, produit: majuscule(l.produit), quantite: l.quantite, categorie: l.categorie }; });
    var comp = complementDe(doc);
    var total = lignes.length, faits = lignes.filter(function (l) { return coches[l.k]; }).length;
    var bar = h("i", { style: "width:" + (total ? Math.round(100 * faits / total) : 0) + "%" });
    var masq = h("input", { type: "checkbox", id: "masquer-coches", checked: masquerCoches, onchange: function () {
      masquerCoches = masq.checked; try { localStorage.setItem("menus-masquer-coches", masquerCoches ? "1" : "0"); } catch (e) {}
      renderCoursesOnglet();
    } });
    var dlNote = h("p", { class: "status", role: "status" });
    var dlBtn = h("button", { type: "button", class: "btn primary dlbtn", text: "Télécharger la liste de courses", onclick: function () { telecharger("courses", dlBtn, dlNote); } });
    if (comp.plus.length || comp.moins.length) {
      panelCourses.append(blocComplement(id, comp));
      panelCourses.append(h("h2", { class: "liste-titre", text: "Liste complète" }));
    }
    panelCourses.append(h("div", { class: "shop-head" },
      h("p", { class: "status", text: faits + " / " + total + " dans le caddie" }),
      h("div", { class: "bar" }, dlBtn, dlNote),
      h("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(faits), "aria-label": "Articles cochés" }, bar),
      h("div", { class: "bar end" }, h("label", { class: "check", for: "masquer-coches" }, masq, " Masquer les articles cochés"),
        faits ? h("button", { type: "button", class: "btn ghost", text: "Tout décocher", onclick: function () {
          var patch = {}; Object.keys(coches).forEach(function (k) { if (coches[k]) { coches[k] = false; patch[k] = false; } });
          ecrireCoches(id, patch); renderCoursesOnglet();
        } }) : null)));
    groupeParRayon(lignes).forEach(function (grp) {
      var visibles = grp.lignes.filter(function (l) { return !(masquerCoches && coches[l.k]); });
      if (!visibles.length) return;
      var restant = grp.lignes.filter(function (l) { return !coches[l.k]; }).length;
      var sec = h("section", { class: "shop-aisle" }, h("h3", null, h("span", { class: "cnum", text: String(M.CAT_ORDER.indexOf(grp.cat) + 1).padStart(2, "0") }), M.CAT_NAMES[grp.cat], h("small", { text: restant ? restant + " à prendre" : "fait" })));
      visibles.forEach(function (l) {
        var cb = h("input", { type: "checkbox", id: "shop-" + l.k, checked: !!coches[l.k] });
        var row = h("label", { class: "shop-item" + (coches[l.k] ? " done" : ""), for: "shop-" + l.k }, cb, h("span", { class: "nm", text: l.produit }), h("span", { class: "qty", text: l.quantite || "" }));
        cb.addEventListener("change", function () {
          coches[l.k] = cb.checked; var p = {}; p[l.k] = cb.checked;
          ecrireCoches(id, p); renderCoursesOnglet();

  }
  /* Bloc « À acheter en plus » / « Plus nécessaires » après modification d'un menu validé. */
  function blocComplement(id, comp) {
    var sec = h("section", { class: "complement", "aria-label": "Complément de courses" });
    if (comp.plus.length) {
      var faits = comp.plus.filter(function (l) { return coches["plus:" + l.k]; }).length;

        h("h2", { text: "À acheter en plus" }),

      sec.append(h("p", { class: "status", text: "Le menu a changé depuis vos courses : seulement ce qui manque." }));
      comp.plus.forEach(function (l) {
        var ck = "plus:" + l.k, cb = h("input", { type: "checkbox", id: "shop-" + ck, checked: !!coches[ck] });
        var info = l.etat === "nouveau" ? "Nouveau" : l.etat === "hausse" ? "Déjà prévu : " + l.avant : "Avant : " + (l.avant || "sans quantité");
        sec.append(h("label", { class: "shop-item" + (coches[ck] ? " done" : ""), for: "shop-" + ck }, cb,
          h("span", { class: "nm" }, l.produit, h("small", { class: "cp-info", text: M.CAT_NAMES[l.categorie] + " · " + info })),
          h("span", { class: "qty", text: l.quantite })));
        cb.addEventListener("change", function () {
          coches[ck] = cb.checked; var p = {}; p[ck] = cb.checked;
          ecrireCoches(id, p); renderCoursesOnglet();

      var dl = h("button", { type: "button", class: "btn primary dlbtn", text: "Télécharger le complément", onclick: function () { telecharger("complement", dl, note); } });

        var patch = {};
        comp.plus.forEach(function (l) { var ck = "plus:" + l.k; if (coches[ck]) { patch[l.k] = true; coches[l.k] = true; } patch[ck] = false; coches[ck] = false; });
        var docM = Store.menus[id];
        fileEcriture = fileEcriture.then(function () { return Store.updateMenu(id, { coches: patch, coursesReference: null }); }).catch(function () {}).then(function () {
          if (docM && Store.mode !== "db") renderCoursesOnglet();

        if (docM) docM.coursesReference = null;

    return sec;
  }
  function ecrireCoches(id, patch) {
    fileEcriture = fileEcriture.then(function () { return Store.updateMenu(id, { coches: patch }); }).catch(function () {});
  }

  /* ---------- Vue PC / smartphone ---------- */
  var vueChoisie = null;
  try { vueChoisie = localStorage.getItem("menus-vue"); } catch (e) {}
  var mqMobile = window.matchMedia ? window.matchMedia("(max-width: 700px)") : null;
  function vueMobile() { return vueChoisie ? vueChoisie === "mobile" : !!(mqMobile && mqMobile.matches); }
  function appliquerVue() { document.body.classList.toggle("vue-mobile", vueMobile()); }
  function choisirVue(v) {
    vueChoisie = v === "auto" ? null : v;
    try { if (vueChoisie) localStorage.setItem("menus-vue", vueChoisie); else localStorage.removeItem("menus-vue"); } catch (e) {}
    appliquerVue(); renderOnglet();
  }
  if (mqMobile && mqMobile.addEventListener) mqMobile.addEventListener("change", function () { if (!vueChoisie) { appliquerVue(); renderOnglet(); } });

  /* ---------- Réglages ---------- */
  var panelRegl = document.getElementById("panel-regl");
  function renderRegl() {
    clear(panelRegl);
    var actuel = vueChoisie || "auto";
    var radios = h("div", { class: "radios", role: "radiogroup", "aria-label": "Affichage" });
    [["auto", "Automatique", "Interface smartphone sur téléphone, interface PC sur ordinateur."], ["mobile", "Toujours smartphone", "Barre d'icônes en bas, une seule colonne."], ["pc", "Toujours PC", "Onglets en haut, mise en page large."]].forEach(function (o) {
      var r = h("input", { type: "radio", name: "vue", id: "vue-" + o[0], value: o[0], checked: actuel === o[0], onchange: function () { choisirVue(o[0]); } });
      radios.append(h("label", { class: "radio", for: "vue-" + o[0] }, r, h("div", null, h("b", { text: o[1] }), h("span", { text: o[2] }))));
    });
    var c1 = h("section", { class: "card" }, h("h2", { text: "Affichage", style: "font-size:1.2rem" }), radios);
    var on = h("input", { type: "checkbox", id: "anim-on", checked: animationsActives(), onchange: function () { try { localStorage.setItem("menus-animation", on.checked ? "1" : "0"); } catch (e) {} } });
    var MOIS = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
    var sel = options(h("select", { id: "anim-mois", "aria-label": "Mois" }), MOIS.map(function (m, i) { return [String(i), m + " — " + THEMES_ANIM[i]]; }), String(new Date().getMonth()));
    var c2 = h("section", { class: "card" }, h("h2", { text: "Animation de validation", style: "font-size:1.2rem" }),
      h("p", { class: "status", text: "Elle se lance à la première validation d'un menu, selon le mois de la semaine. Pas quand on modifie un menu déjà validé." }),
      h("label", { class: "check", for: "anim-on" }, on, " Activer l'animation"),
      h("div", { class: "pickbar" }, sel, h("button", { type: "button", class: "btn", text: "▶ Voir", onclick: function () { animerValidation(+sel.value); } })));
    panelRegl.append(carteCodeAcces(), c1, c2);

  Array.prototype.forEach.call(document.querySelectorAll(".bottombar button"), function (b) {
    b.addEventListener("click", function () { choisirOnglet(b.getAttribute("data-tab")); window.scrollTo(0, 0); });
  });

  /* ---------- Navigation ---------- */
  var ONGLETS_HIST = ["hist", "rec", "art", "regl"];
  function choisirOnglet(n) {

  function renderOnglet() {
    renderEntete();

    else if (ongletActif === "courses") renderCoursesOnglet();
    else if (ongletActif === "hist") renderHist();

    else if (ongletActif === "regl") renderRegl();

    b.addEventListener("click", function () { choisirOnglet(b.getAttribute("data-sub")); });

  /* ---------- Démarrage ---------- */
  var premierChargement = true;
  Store.onChange = function (quoi) {

      if (ongletActif === "rec") { if (!fiche) renderRec(); else if (fiche.mode === "lecture" && fiche.id && TOUTES.some(function (x) { return x._id === fiche.id; })) rouvrir(fiche.id, fiche.msg); }

    if (ongletActif === "hist") renderHist();
    else if (ongletActif === "rec") renderRec();
    else if (ongletActif === "courses") renderCoursesOnglet();
    else if (etaitValide) renderPrep();

    }

  S = etatVide();
  var b = lsGet(cleBrouillon()); if (b) S = b;
  appliquerVue();
  majVerrou();
  choisirOnglet("prep");
  Store.init();
})();
