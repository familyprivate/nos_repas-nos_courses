<style>
/* Layout : une colonne de 880px au style « Éditorial » des feuilles A4 — Inter, grands numéros, filets noirs.
   La couleur d'accent est celle du mois majoritaire de la semaine (posée par le script). */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --sunk: #F4F5F7;
  --ink: #111318;
  --muted: #6B7080;
  --line: #E2E4E9;
  --rule: #111318;
  --accent: var(--accent-l, #A84212);
  --accent-soft: color-mix(in srgb, var(--accent-vif, #D2591A) 13%, var(--bg));
  --on-ink: #FFFFFF;
  --warn: #8A5300;
  --warn-soft: #FBEFD9;
  --danger: #B3261E;
  --danger-soft: #FBE4E2;
  --st-prevu: #E3F2E5; --st-prevu-line: #A9D3B0;
  --st-exclu: #F9E1DF; --st-exclu-line: #E5A9A3;
  --st-invit: #FBF1CC; --st-invit-line: #E3CB73;
  --st-resto: #DFEBF8; --st-resto-line: #A3C2E6;
  --font: "Inter", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1115; --surface: #15181E; --sunk: #1B1F26; --ink: #F2F3F5; --muted: #9AA0AD; --line: #2A2F38; --rule: #F2F3F5;
    --accent: var(--accent-d, #F08A55); --on-ink: #0F1115;
    --warn: #F0B860; --warn-soft: #3A2D16; --danger: #F2877F; --danger-soft: #3A1F1E;
    --st-prevu: #1C3424; --st-prevu-line: #2F5A3C; --st-exclu: #3A1F1E; --st-exclu-line: #663532;
    --st-invit: #3A3218; --st-invit-line: #6A5A26; --st-resto: #1B2B3D; --st-resto-line: #31506F;
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .dnum { color: var(--dn-d, var(--accent)); }
}
:root[data-theme="dark"] {
  --bg: #0F1115; --surface: #15181E; --sunk: #1B1F26; --ink: #F2F3F5; --muted: #9AA0AD; --line: #2A2F38; --rule: #F2F3F5;
  --accent: var(--accent-d, #F08A55); --on-ink: #0F1115;
  --warn: #F0B860; --warn-soft: #3A2D16; --danger: #F2877F; --danger-soft: #3A1F1E;
  --st-prevu: #1C3424; --st-prevu-line: #2F5A3C; --st-exclu: #3A1F1E; --st-exclu-line: #663532;
  --st-invit: #3A3218; --st-invit-line: #6A5A26; --st-resto: #1B2B3D; --st-resto-line: #31506F;
  color-scheme: dark;
}
:root[data-theme="dark"] .dnum { color: var(--dn-d, var(--accent)); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.5;
  font-feature-settings: "tnum" 1, "cv11" 1;
  padding-inline: 20px; padding-block: 28px 72px;
}
.app { max-width: 880px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-family: var(--font); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2 { font-weight: 800; letter-spacing: -.015em; }

/* En-tête façon feuille A4 */
.top { position: relative; display: flex; align-items: flex-end; min-height: 214px; padding-right: 250px; padding-bottom: 18px; border-bottom: 6px solid var(--rule); }
/* La famille est posée sur le filet : le bas de l'image touche le haut du trait. */
.famille { position: absolute; right: 4px; bottom: 0; height: 210px; width: auto; max-width: 46%; object-fit: contain; object-position: bottom right; pointer-events: none; user-select: none; }
.navrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-top: -10px; }
.top-title { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font-size: clamp(2.6rem, 7vw, 4.2rem); line-height: .95; font-weight: 800; letter-spacing: -.035em; }
.topright { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.weeknav { display: flex; align-items: center; gap: 4px; border: 2px solid var(--rule); border-radius: 4px; padding: 2px; }
.weeknav button { border: 0; background: none; width: 38px; height: 36px; border-radius: 2px; cursor: pointer; font-size: 20px; color: var(--ink); }
.weeknav button:hover { background: var(--sunk); }
.weeknav span { font-size: 14px; font-weight: 600; padding-inline: 6px; white-space: nowrap; }
.basebtn { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--rule); background: transparent; border-radius: 4px; padding: 6px 12px; height: 44px; cursor: pointer; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.basebtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.basebtn:hover, .basebtn[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.basenav { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.basenav h2 { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; }
.seg { display: flex; border: 2px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 9px 16px; cursor: pointer; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg button + button { border-left: 2px solid var(--rule); }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--on-ink); }
.radios { display: flex; flex-direction: column; gap: 8px; }
.radio { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 4px; cursor: pointer; }
.radio input { accent-color: var(--accent); width: 18px; height: 18px; margin: 2px 0 0; }
.radio b { display: block; }
.radio span { color: var(--muted); font-size: 14px; }
.radio:has(input:checked) { border-color: var(--rule); box-shadow: inset 4px 0 0 var(--accent); }

.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { background: none; border: 0; border-bottom: 4px solid transparent; padding: 10px 12px; cursor: pointer; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.status { font-size: 14px; color: var(--muted); }
.status.warn { color: var(--warn); }
.status.err { color: var(--danger); }
.empty { color: var(--muted); font-size: 15px; }
.lbl { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Sections numérotées : filet épais au-dessus, pas de carte */
.stack { display: flex; flex-direction: column; gap: 22px; }
.card { border-top: 3px solid var(--rule); padding-top: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card.zone-danger { border-top-color: var(--danger); }
.q-head { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline; }
.q-num { font-size: 30px; font-weight: 800; color: var(--accent); line-height: 1; letter-spacing: -.02em; }
.q-head h2 { font-size: 1.35rem; font-weight: 800; letter-spacing: -.01em; }
.q-head p { grid-column: 2; color: var(--muted); font-size: 14px; max-width: 64ch; }

/* Grille des créneaux */
.daygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.daybox { border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.daybox.changed { border-color: var(--rule); box-shadow: inset 0 3px 0 var(--accent); }
.dayhead { display: flex; align-items: baseline; gap: 10px; }
.dnum { font-size: 40px; font-weight: 800; line-height: .9; letter-spacing: -.03em; color: var(--dn-l, var(--accent)); }
.dname { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.slotrow { display: grid; grid-template-columns: 3rem minmax(0, 1fr); gap: 6px 8px; align-items: center; }
.slotrow label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.slotrow input { grid-column: 2; }
select, input[type="text"], input[type="date"] {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 4px; padding: 8px 10px; width: 100%; min-width: 0;
}
select:hover, input[type="text"]:hover, input[type="date"]:hover { border-color: var(--muted); }
select.etat { font-weight: 600; }
select.etat[data-etat="prevu"] { background: var(--st-prevu); border-color: var(--st-prevu-line); }
select.etat[data-etat="exclu"] { background: var(--st-exclu); border-color: var(--st-exclu-line); }
select.etat[data-etat="invitation"] { background: var(--st-invit); border-color: var(--st-invit-line); }
select.etat[data-etat="resto"] { background: var(--st-resto); border-color: var(--st-resto-line); }
select.etat option { background: var(--surface); color: var(--ink); }

.rows { display: flex; flex-direction: column; gap: 8px; }
.irow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr) auto; gap: 8px; align-items: center; }
.arow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px; align-items: center; }
.mform { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, .8fr) auto; gap: 8px; align-items: center; }
.pickbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.rowtools { display: flex; gap: 2px; align-items: center; }

/* Boutons */
.btn { border: 2px solid var(--rule); background: transparent; border-radius: 4px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 15px; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); font-weight: 700; padding: 12px 22px; }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 4px; }
.btn.ghost:hover { text-decoration: underline; background: none; }
.btn.ghost[disabled] { color: var(--muted); text-decoration: none; opacity: 1; cursor: default; }
.btn.mini { font-size: 13px; padding: 4px 6px; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: var(--danger); color: #FFFFFF; }
.btn.danger[disabled] { opacity: .45; background: none; color: var(--danger); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon { border: 1px solid transparent; background: none; border-radius: 4px; width: 32px; height: 32px; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; flex: none; }
.icon:hover { background: var(--sunk); color: var(--ink); border-color: var(--line); }
.icon[disabled] { cursor: default; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.bar.end { justify-content: space-between; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
details summary { cursor: pointer; font-weight: 600; }

/* Menu : comme la feuille A4 */
.menu { border-top: 6px solid var(--rule); }
.mrow { display: grid; grid-template-columns: 9rem minmax(0, 1fr) minmax(0, 1fr); border-bottom: 1px solid var(--line); }
.mrow.head { border-bottom: 0; }
.mrow.head > div { padding: 10px 14px 0; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mday { padding: 14px 14px 14px 0; display: flex; flex-direction: column; gap: 4px; }
.mday .dnum { font-size: 56px; }
.mday b { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mrow.is-today .mday b::after { content: " · aujourd'hui"; color: var(--accent); }
.mcell { padding: 16px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mcell .lab { display: none; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mline { display: flex; gap: 6px; align-items: flex-start; justify-content: space-between; }
.mname { font-weight: 700; font-size: 18px; line-height: 1.25; overflow-wrap: anywhere; letter-spacing: -.005em; }
.mname.off { color: var(--line); font-weight: 300; }
.mname.evt { font-style: italic; font-weight: 500; color: var(--accent); }
.mtools { display: flex; gap: 2px; flex: none; }
.mtools .icon { width: 30px; height: 30px; font-size: 15px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 2px; background: var(--accent-soft); color: var(--accent); }
.tag.warn { background: var(--warn-soft); color: var(--warn); text-transform: none; letter-spacing: 0; font-weight: 600; }
.notes { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.notes .warn { color: var(--warn); }

/* Courses par rayon */
.aisles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 22px 36px; align-items: start; }
.aisle { min-width: 0; }
.aisle h3, .shop-aisle h3 { display: flex; align-items: baseline; gap: 10px; font-size: 17px; font-weight: 800; padding-bottom: 8px; border-bottom: 3px solid var(--rule); }
.aisle h3 small, .shop-aisle h3 small { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
.cnum { color: var(--accent); font-weight: 800; }
.items { list-style: none; margin: 0; padding: 0; }
.items li { border-bottom: 1px solid var(--line); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 6px 0; }
.item .nm { overflow-wrap: anywhere; }
.item .qty { font-weight: 700; color: var(--accent); white-space: nowrap; }
.add { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-left: 8px; }
.removed { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.addbox { display: flex; flex-direction: column; gap: 10px; border-top: 3px solid var(--rule); padding-top: 14px; }

.validate { border-top: 6px solid var(--rule); background: var(--sunk); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.validate p { font-weight: 700; font-size: 1.1rem; letter-spacing: -.005em; }

.today { border-left: 6px solid var(--accent); background: var(--accent-soft); padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
.today .lbl { color: var(--accent); }
.today p { font-size: 1.1rem; }
.today b { font-weight: 800; }

.sheets { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.sheet { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sheet h3 { font-size: 15px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.sheet img { width: 100%; height: auto; border: 1px solid var(--line); background: #fff; box-shadow: 0 8px 24px rgba(17,19,24,.10); }

/* Historique, recettes, articles */
.hweek { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.hweek .bar { justify-content: space-between; }
.hweek b { font-weight: 800; font-size: 15px; }
.hweek p { color: var(--muted); font-size: 14px; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
.tablewrap { overflow-x: auto; border-top: 3px solid var(--rule); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; background: var(--bg); position: sticky; top: 0; }
td.num { white-space: nowrap; }
tr.grp td { font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); padding-top: 18px; border-bottom: 2px solid var(--rule); }
td.starcell { width: 44px; }
.star { border: 0; background: none; cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted); padding: 2px 6px; border-radius: 4px; }
.star:hover { background: var(--sunk); }
.star.on { color: #E5AC00; }
td .add { margin-left: 8px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 2px; white-space: nowrap; }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.pill.wait { background: var(--sunk); color: var(--muted); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filter input { max-width: 260px; }

/* Liste à cocher (onglet Courses) */
.shop-head { display: flex; flex-direction: column; gap: 12px; }
.shop-head h2 { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; }
.progress { height: 10px; background: var(--sunk); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.shop-aisle { min-width: 0; }
.shop-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 2px; cursor: pointer; border-bottom: 1px solid var(--line); min-height: 52px; }
.shop-item input { width: 24px; height: 24px; margin: 0; accent-color: var(--accent); }
.shop-item .nm { overflow-wrap: anywhere; font-size: 16px; }
.shop-item .qty { font-weight: 700; color: var(--accent); white-space: nowrap; }
.shop-item.done .nm { text-decoration: line-through; color: var(--muted); }
.shop-item.done .qty { color: var(--muted); }

/* Boîte de dialogue */
.overlay { position: fixed; inset: 0; background: rgba(10, 12, 16, .55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { background: var(--surface); color: var(--ink); border-top: 6px solid var(--danger); width: min(100%, 480px); padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.dialog h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; }
.dialog p { font-size: 14px; color: var(--muted); }
.dialog.apercu { border-top-color: var(--rule); width: min(100%, 560px); max-height: 92vh; overflow: auto; }
.dialog.apercu img { width: 100%; height: auto; border: 1px solid var(--line); }
body.vue-mobile .dlbtn { width: 100%; padding-block: 15px; font-size: 16px; }
.dialog #reset-code { font-size: 20px; font-weight: 700; letter-spacing: .2em; padding: 10px 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 4px; width: 100%; }

/* Écran de verrouillage */
body.verrouille .app, body.verrouille .bottombar { display: none !important; }
.verrou { min-height: 80vh; display: grid; place-items: center; }
.lock { width: min(100%, 440px); display: flex; flex-direction: column; gap: 18px; }
.lock-head { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; min-height: 150px; padding-right: 44%; padding-bottom: 14px; border-bottom: 6px solid var(--rule); }
.lock-head .famille { height: 146px; max-width: 46%; right: 0; bottom: 0; }
.lock-head h1 { font-size: clamp(2rem, 8vw, 2.8rem); }
.lock-txt { color: var(--muted); font-size: 15px; }
.lock-form { display: flex; flex-direction: column; gap: 12px; }
.codefield { display: flex; flex-direction: column; gap: 6px; }
.codefield .bar.end { flex-direction: row !important; align-items: center !important; }
.codein { font-size: 24px !important; font-weight: 700; letter-spacing: .3em; padding: 12px 14px !important; text-align: center; background: var(--surface); border: 2px solid var(--rule) !important; border-radius: 4px; width: 100%; }
.lock-form .btn.primary { width: 100%; padding-block: 15px; font-size: 16px; }

/* Barre du bas (smartphone) */
.bottombar { display: none; }
.bottombar button { border: 0; border-top: 3px solid transparent; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; min-height: 54px; }
.bottombar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bottombar button[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }
.bottombar button[aria-current="page"] svg { stroke: var(--accent); }

@media (max-width: 620px) {
  .mrow { grid-template-columns: 1fr 1fr; }
  .mrow.head { display: none; }
  .mday { grid-column: 1 / -1; flex-direction: row; gap: 10px; align-items: baseline; padding: 12px 0 0; }
  .mday .dnum { font-size: 40px; }
  .mcell .lab { display: block; }
  .irow, .arow, .mform { grid-template-columns: 1fr 1fr; }
  .irow > :first-child, .arow > :first-child, .mform > :first-child { grid-column: 1 / -1; }
}

/* ===== Interface smartphone ===== */
body.vue-mobile { padding-inline: 16px; padding-block: 16px calc(92px + env(safe-area-inset-bottom, 0px)); }
body.vue-mobile .app { max-width: 560px; gap: 18px; }

body.vue-mobile .basebtn span { display: none; }
body.vue-mobile .basebtn { width: 48px; justify-content: center; padding: 0; flex: none; }
body.vue-mobile .seg { align-self: stretch; }
body.vue-mobile .seg button { flex: 1; padding-inline: 6px; }
body.vue-mobile .weeknav { flex: 1; justify-content: space-between; }
body.vue-mobile .weeknav button { width: 46px; height: 42px; }
body.vue-mobile select, body.vue-mobile input[type="text"], body.vue-mobile input[type="date"] { font-size: 16px; padding-block: 10px; }
body.vue-mobile .daygrid { grid-template-columns: 1fr; }
body.vue-mobile .irow, body.vue-mobile .arow, body.vue-mobile .mform { grid-template-columns: 1fr 1fr; }
body.vue-mobile .irow > :first-child, body.vue-mobile .arow > :first-child, body.vue-mobile .mform > :first-child { grid-column: 1 / -1; }
body.vue-mobile .pickbar { grid-template-columns: 1fr; }
body.vue-mobile .mrow { grid-template-columns: 1fr; }
body.vue-mobile .mrow.head { display: none; }
body.vue-mobile .mday { flex-direction: row; gap: 12px; align-items: baseline; padding: 14px 0 4px; }
body.vue-mobile .mday .dnum { font-size: 44px; }
body.vue-mobile .mcell { flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
body.vue-mobile .mcell .lab { display: block; width: 3.2rem; flex: none; padding-top: 4px; }
body.vue-mobile .mcell > .mline, body.vue-mobile .mcell > select { flex: 1; min-width: 0; }
body.vue-mobile .mcell > .tags { flex-basis: 100%; padding-left: calc(3.2rem + 12px); }
body.vue-mobile .mtools .icon, body.vue-mobile .icon { width: 42px; height: 42px; font-size: 18px; }
body.vue-mobile .validate .btn.primary, body.vue-mobile form > .bar .btn.primary { width: 100%; padding-block: 15px; font-size: 16px; }
body.vue-mobile .bar.end { flex-direction: column; align-items: stretch; }
body.vue-mobile .sheets { grid-template-columns: 1fr; }
body.vue-mobile .aisles { gap: 18px; }
body.vue-mobile .bottombar {
  display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 2px solid var(--rule);
  padding: 0 4px env(safe-area-inset-bottom, 0px);
}

  function norm(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, " ").replace(/\s+/g, " ").trim();
  }

  /* ---------- Dates ---------- */
  function d0(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { var x = d0(d); x.setDate(x.getDate() + n); return x; }
  function iso(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fromIso(s) { var p = String(s).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fr(d) {
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
  }
  /* Prochain samedi strictement après aujourd'hui (un samedi → samedi suivant). */
  function prochainSamedi(today) {
    var t = d0(today || new Date());
    var n = (6 - t.getDay() + 7) % 7 || 7;
    return addDays(t, n);
  }
  /* Index de semaine ancré sur le samedi : deux dates d'une même semaine samedi→vendredi ont le même index. */
  var ANCRE = new Date(2000, 0, 1); // samedi 01/01/2000
  function semaineIdx(d) {
    return Math.floor(Math.round((d0(d) - ANCRE) / 86400000) / 7);
  }

  /* ---------- Saisons ---------- */
  function saisonDe(d) {
    var md = (d.getMonth() + 1) * 100 + d.getDate();
    if (md >= 1221 || md <= 319) return "hiver";
    if (md <= 620) return "printemps";
    if (md <= 921) return "ete";
    return "automne";
  }
  function enSaison(rec, d) {

    return s.indexOf(saisonDe(d)) !== -1;

  function parseCreneaux(t) {

    if (/le week-?end/.test(t)) return function (j) { return j < 2; };
    if (/en semaine/.test(t)) return function (j) { return j >= 2; };
    if (/^le soir$|^soir$/.test(t)) return function (j, r) { return r === "Soir"; };
    if (/^le midi$|^midi$/.test(t)) return function (j, r) { return r === "Midi"; };
    var re = /(samedi|dimanche|lundi|mardi|mercredi|jeudi|vendredi)(?:\s+(midi|soir))?/g, m, ok = {};

  /* ---------- Onglet Courses : liste à cocher en magasin ---------- */
  var panelCourses = document.getElementById("panel-courses");
  var masquerCoches = false;
  try { masquerCoches = localStorage.getItem("menus-masquer-coches") === "1"; } catch (e) {}
  var coches = {}, cochesSemaine = null, fileEcriture = Promise.resolve();
  function renderCoursesOnglet() {

    panelCourses.append(h("div", { class: "shop-head" },

      h("div", { class: "bar" }, dlBtn, dlNote),
      h("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(faits), "aria-label": "Articles cochés" }, bar),
      h("div", { class: "bar end" }, h("label", { class: "check", for: "masquer-coches" }, masq, " Masquer les articles cochés"),
        faits ? h("button", { type: "button", class: "btn ghost", text: "Tout décocher", onclick: function () {
          var patch = {}; Object.keys(coches).forEach(function (k) { if (coches[k]) { coches[k] = false; patch[k] = false; } });

      var sec = h("section", { class: "shop-aisle" }, h("h3", null, h("span", { class: "cnum", text: String(M.CAT_ORDER.indexOf(grp.cat) + 1).padStart(2, "0") }), M.CAT_NAMES[grp.cat], h("small", { text: restant ? restant + " à prendre" : "fait" })));

        var cb = h("input", { type: "checkbox", id: "shop-" + l.k, checked: !!coches[l.k] });

  function ecrireCoches(id, patch) {
    fileEcriture = fileEcriture.then(function () { return Store.updateMenu(id, { coches: patch }); }).catch(function () {});
  }

  /* ---------- Vue PC / smartphone ---------- */
  var vueChoisie = null;
  try { vueChoisie = localStorage.getItem("menus-vue"); } catch (e) {}
  var mqMobile = window.matchMedia ? window.matchMedia("(max-width: 700px)") : null;
  function vueMobile() { return vueChoisie ? vueChoisie === "mobile" : !!(mqMobile && mqMobile.matches); }

  if (mqMobile && mqMobile.addEventListener) mqMobile.addEventListener("change", function () { if (!vueChoisie) { appliquerVue(); renderOnglet(); } });

  /* ---------- Réglages ---------- */
  var panelRegl = document.getElementById("panel-regl");

    clear(panelRegl);

    var radios = h("div", { class: "radios", role: "radiogroup", "aria-label": "Affichage" });

  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function (b) {

  document.getElementById("prev").addEventListener("click", function () { allerSemaine(M.addDays(debut, -7)); });
  document.getElementById("next").addEventListener("click", function () { allerSemaine(M.addDays(debut, 7)); });

    if (premierChargement) { premierChargement = false; chargerSemaine(); renderOnglet(); return; }
    // Mise à jour de l'historique : ne pas écraser une saisie en cours.

      var v = Store.menus[M.iso(debut)];

    }
    renderEntete();
    if (ongletActif === "hist") renderHist();
    else if (ongletActif === "rec") renderRec();
    else if (ongletActif === "courses") renderCoursesOnglet();

      var go = panelPrep.querySelector("button[type=submit].primary");
      if (go) { go.disabled = false; go.textContent = "Générer le menu"; }
    }
  };
  S = etatVide();
  var b = lsGet(cleBrouillon()); if (b) S = b;
